<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Mate - Sales</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body class="Sale">
    <header class="header">
        <h1 class="logo">Market Mate</h1>
        <nav>
            <a href="./index.html">Dashboard</a>
            <a href="./add-stock.html">Add Stock</a>
            <a href="./sales.html">Sales</a>
            <a href="./about.html">About</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Record a Sale</h2>
            <form id="sale-form">
                <div class="form-row">
                    <label for="item">Select Item:</label>
                    <select id="item" required></select>
                </div>
                <div class="form-row">
                    <label for="qty">Quantity Sold (kg):</label>
                    <input type="number" id="qty" min="0.1" step="0.1" required>
                </div>
                <button type="submit">Record Sale</button>
            </form>
            <p id="sale-msg" class="message"></p>
        </section>

        <section>
            <h3>Recent Sales</h3>
            <p class="empty-msg">No sales recorded yet. Add stock first!</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Market Mate - Helping mama mboga</p>
    </footer>

    <script src="./mama-mboga.js"></script>
</body>

</html>
