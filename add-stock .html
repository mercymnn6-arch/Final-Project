<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

<body>
    <title>Market Mate - Add Stock</title>
        <link rel="stylesheet" href="style.css">
</head>
<body class="stock">
<header>
    <!--Header-->
    <h1>Market Mate</h1>
    <!--Navigation bars-->
        <nav>
        <a href="index.html">Dashboard</a>
        <a href="add- stock .html">Add Stock</a>
        <a href="sales.html">Sales</a>
        <a href="about.html">About</a>
    </nav>
</header>
<main>
    <!--form-container-->
    <section  class="form-container">
        <h2>Add New Item to Stock</h2>
        <!--forms-->
        <form id="add-form">
<div class="form-row">
        <label for="name">Item Name:</label>
        <input type="text" id="name" required>
</div>
    <div class="form-row">
    <label for="stock">Stock Quantity:</label>
    <input type="number" id="stock" min="0" required>
</div>
    <div class="form-row">
    <label for="buy">Buy Price (KSh):</label>
    <input type="number" id="buy" min="0" step="0.01" required>
</div>
<div class="form-row">
    <label for="sell">Sell Price (KSh):</label>
    <input type="number" id="sell" min="0" step="0.01" required>
</div>

<button type="submit">Add Item</button>

</form>
<p id="add-msg" class="message"></p>
</section>
</main>

<footer>
<p>© 2026 Market Mate - Helping mama mboga</p>
</footer>

<script src="mama mboga.js"></script>
</body>
</html>
