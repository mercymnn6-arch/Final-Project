<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Mate - Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="logo">Market Mate</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="./index.html">Dashboard</a></li>
                <li><a href="./add-stock.html">Add Stock</a></li>
                <li><a href="./sales.html">Sales</a></li>
                <li><a href="./about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="dashboard">
            <h2>Dashboard</h2>
            <p>Welcome! Track your stock, sales and profit here.</p>
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Items</h3>
                    <p id="total-items">0</p>
                </div>
                <div class="card">
                    <h3>Stock Value (KSh)</h3>
                    <p id="stock-value">0</p>
                </div>
                <div class="card">
                    <h3>Today's Sales (KSh)</h3>
                    <p id="today-sales">0</p>
                </div>
                <div class="card">
                    <h3>Total Profit (KSh)</h3>
                    <p id="total-profit">0</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Market Mate - Helping mama mboga</p>
    </footer>

    <script src="./mama-mboga.js"></script>
</body>

</html>
