<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MarketMate-Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="logo">Market Mate</h1>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="add-stock.html">Add Stock</a></li>
                <li><a href="sales.html">Sales</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
</body>
<main>
    <section>
        <h2>Dashboard</h2>
        <p>Welcome! Track your stock,sales and profit here.</p>
        <div class="summary-cards">
            <div class="card">
                <h3>Total Items</h3>
                <p id="total-items">0</p>
            </div>
            <div class="card">
                <h3>Stock Value (Ksh) </h3>
                <p id="stock-value">0</p>
            </div>
            <div class="card">
                <h3>Today's Sales (Ksh) </h3>
                <p id="today-sales">0</p>
            </div>
            <div class="card">
                <h3>Total Profit (Ksh) </h3>
                <p id="today-profit">0</p>
            </div>
        </div>
    </section>
</main>
<footer>
    <p>© 2026 Market Mate - Helping mama mboga</p>
</footer>
<script src="./mama-mboga.js"></script>
</body>

</html>
